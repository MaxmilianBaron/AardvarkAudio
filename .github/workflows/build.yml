name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
        shared: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix install
      - run: cmake -S tests/consumer -B consumer -A ${{ matrix.arch }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - run: cmake --build consumer --config Release
      - shell: pwsh
        run: |
          $env:PATH = "$PWD/install/bin;" + $env:PATH
          ./consumer/Release/audio_consumer.exe
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "$PWD/install"
      - run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/install"
      - run: cmake --build consumer && ./consumer/audio_consumer
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 9047fa1b084f76b1b4d065af2d743df1b40dfb56
          path: build-ffmpeg
      - name: Install reference encoder headers
        timeout-minutes: 3
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libmp3lame-dev
      - working-directory: build-ffmpeg
        run: |
          git fetch --depth 1 origin tag n8.1
          test "$(git rev-parse 'n8.1^{commit}')" = 9047fa1b084f76b1b4d065af2d743df1b40dfb56
          ./configure --disable-doc --disable-debug --disable-network --disable-autodetect --disable-everything --disable-x86asm --enable-ffmpeg --enable-libmp3lame --enable-protocol=file,pipe --enable-demuxer=wav,mp3 --enable-muxer=wav,mp3,pcm_s16le --enable-decoder=pcm_u8,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f64le,pcm_alaw,pcm_mulaw,adpcm_ima_wav,adpcm_ms,mp3float --enable-encoder=pcm_u8,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f64le,pcm_alaw,pcm_mulaw,adpcm_ima_wav,adpcm_ms,libmp3lame --enable-filter=aresample,aformat,anull
          make -j2
          echo "$PWD" >> "$GITHUB_PATH"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAARDVARK_AUDIO_SANITIZERS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: python3 tests/reference.py build/aardvark_decode
