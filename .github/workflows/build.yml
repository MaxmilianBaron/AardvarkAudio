name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
        shared: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build --config Release
      - run: cmake --install build --config Release --prefix install
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build --parallel
      - run: cmake --install build --prefix "$PWD/install"
